<svg width="120" height="48" viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brand mark">
  <defs>
    <linearGradient id="brandGold" x1="8" y1="8" x2="112" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9E27A"/>
      <stop offset="0.45" stop-color="#E8B923"/>
      <stop offset="1" stop-color="#C9920A"/>
    </linearGradient>
    <filter id="brandSoft" x="-8%" y="-20%" width="116%" height="140%">
